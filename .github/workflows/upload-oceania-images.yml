name: Upload imagens Oceania

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/upload-oceania-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-oceania-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar imagens diretamente para data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          getimg() {
            out="$1"
            url="$2"
            echo "Baixando $out"
            curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' "$url" -o "data/$out"
            file "data/$out"
            if ! file "data/$out" | grep -qiE 'JPEG image data|PNG image data|WebP image data'; then
              echo "Arquivo invalido: data/$out"
              exit 1
            fi
          }

          getimg 'murujuga.jpg' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Burrup_Rock_Art.jpg?width=1600'
          getimg 'kakadu_ubirr.jpg' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Ubirr_rock_art_Jul2013_18.jpg?width=1600'
          getimg 'nawarla_gabarnmang.jpg' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Gabarnmang_Cave_-_1.jpg?width=1600'
          getimg 'kimberley_gwion.jpg' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Bradshaw_rock_paintings2.jpg?width=1600'

      - name: Commitar imagens
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/murujuga.jpg \
            data/kakadu_ubirr.jpg \
            data/nawarla_gabarnmang.jpg \
            data/kimberley_gwion.jpg

          if git diff --cached --quiet; then
            echo 'As imagens ja estao atualizadas.'
            exit 0
          fi

          git commit -m 'Adiciona imagens dos locais da Oceania [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
