name: Upload imagem Monte Alegre

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/upload-americas-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-monte-alegre:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar imagem de Monte Alegre diretamente para data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' \
            'https://wmf.imgix.net/images/bc_8_-_monte_alegre_img_8290.jpg?fm=jpg&w=1600' \
            -o data/pedra_pintada_monte_alegre.jpg
          file data/pedra_pintada_monte_alegre.jpg
          if ! file data/pedra_pintada_monte_alegre.jpg | grep -qiE 'JPEG image data|PNG image data|WebP image data'; then
            echo 'Arquivo invalido: data/pedra_pintada_monte_alegre.jpg'
            exit 1
          fi

      - name: Commitar imagem
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pedra_pintada_monte_alegre.jpg
          if git diff --cached --quiet; then
            echo 'A imagem ja esta atualizada.'
            exit 0
          fi
          git commit -m 'Adiciona imagem de Monte Alegre [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
