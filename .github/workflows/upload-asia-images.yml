name: Upload imagens Asia

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/upload-asia-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-asia-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar imagens diretamente para data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          getimg() {
            out="$1"
            url="$2"
            echo "Baixando $out"
            curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' "$url" -o "data/$out"
            file "data/$out"
            if ! file "data/$out" | grep -qiE 'JPEG image data|PNG image data|WebP image data'; then
              echo "Arquivo invalido: data/$out"
              exit 1
            fi
          }

          getimg 'liang_metanduno.jpg' 'https://s.err.ee/photo/crop/2026/01/22/3162224he806t46.jpg'
          getimg 'leang_bulu_sipong_4.jpg' 'https://i.natgeofe.com/n/ce0d129b-4800-43ed-bb6e-909a40b2c946/02_cave_sulawesi-hunting-scene-credit-ratno-sardi.jpg'
          getimg 'bhimbetka.jpg' 'https://upload.wikimedia.org/wikipedia/commons/c/c0/Rock_Shelter_8%2C_Bhimbetka_03.jpg'
          getimg 'tamgaly.jpg' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Petroglyphs_in_Tamgaly%2C_Kazakhstan_02.jpg?width=1600'
          getimg 'gobustan.jpg' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Petroglyphs_in_Gobustan_04.jpg?width=1600'
          getimg 'hail_jubbah_shuwaymis.jpg' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Petroglyph%2C_Jubbah_rock_art_site%2C_Saudi_Arabia_%282%29.jpg?width=1600'
          getimg 'helan_mountains.jpg' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Helan_Mountain%E2%80%99s_rock_paintings.jpg?width=1600'
          getimg 'mongolian_altai.jpg' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Altai_Petroglyph.jpg?width=1600'

      - name: Commitar imagens
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/liang_metanduno.jpg \
            data/leang_bulu_sipong_4.jpg \
            data/bhimbetka.jpg \
            data/tamgaly.jpg \
            data/gobustan.jpg \
            data/hail_jubbah_shuwaymis.jpg \
            data/helan_mountains.jpg \
            data/mongolian_altai.jpg

          if git diff --cached --quiet; then
            echo 'As imagens ja estao atualizadas.'
            exit 0
          fi

          git commit -m 'Adiciona imagens dos locais da Asia [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
