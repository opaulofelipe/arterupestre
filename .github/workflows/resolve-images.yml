name: Resolver imagens automaticamente

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - image_resolver.py
      - requirements_resolver.txt
      - data/locais.json
      - .github/workflows/resolve-images.yml

permissions:
  contents: write

jobs:
  resolve-images:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements_resolver.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_resolver.txt

      - name: Resolver imagens
        run: |
          python image_resolver.py \
            --input data/locais.json \
            --output data/locais_resolvidos.json \
            --overwrite \
            --no-cache \
            --candidates 12 \
            --download-candidates 6 \
            --query-variants 3 \
            --contact "https://github.com/${{ github.repository }}"

      - name: Salvar banco resolvido
        run: |
          if [ -n "$(git status --porcelain data/locais_resolvidos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/locais_resolvidos.json
            git commit -m "Atualiza imagens resolvidas automaticamente"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Nenhuma alteração no banco resolvido."
          fi
